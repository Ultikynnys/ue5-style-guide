<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Gamemakin UE5 Style Guide - Rules</title>
    <meta
      name="description"
      content="A browsable, searchable rendering of the Gamemakin Unreal Engine style guide rules, parsed live from README.md."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23b45309'/%3E%3Ctext%20x='16'%20y='23'%20font-family='monospace'%20font-size='17'%20fill='%23ffffff'%20text-anchor='middle'%3ESG%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem("sg-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var query = new URLSearchParams(window.location.search).get("theme");
          var forced = query === "light" || query === "dark" ? query : null;
          var theme = forced || stored || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">Loading rules from README.md...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
