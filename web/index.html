<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Haeretica Style Guide - Rules</title>
    <meta
      name="description"
      content="A browsable, searchable rendering of the Haeretica style guide rules, parsed live from README.md."
    />
    <link
      rel="icon"
      type="image/png"
      href="./src/assets/Haeretica_H.png"
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem("sg-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var query = new URLSearchParams(window.location.search).get("theme");
          var forced = query === "light" || query === "dark" ? query : null;
          var theme = forced || stored || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">Loading rules from README.md...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
